<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cloudCityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FFC72C" />
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A3B53" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="24" fill="#0D1B2A" />
  
  <!-- Server Towers / Skyline Silhouette -->
  <rect x="20" y="38" width="16" height="38" rx="2" fill="url(#towerGrad)" stroke="#384C66" stroke-width="1.5"/>
  <rect x="42" y="24" width="16" height="52" rx="2" fill="url(#towerGrad)" stroke="#384C66" stroke-width="1.5"/>
  <rect x="64" y="32" width="16" height="44" rx="2" fill="url(#towerGrad)" stroke="#384C66" stroke-width="1.5"/>
  
  <!-- Glowing Warm Yellow Server Windows -->
  <circle cx="25" cy="44" r="1.5" fill="#FFC72C" />
  <circle cx="31" cy="44" r="1.5" fill="#FF9900" />
  <circle cx="25" cy="50" r="1.5" fill="#FF9900" />
  <circle cx="31" cy="50" r="1.5" fill="#FFC72C" />
  <circle cx="25" cy="56" r="1.5" fill="#FFC72C" />
  <circle cx="31" cy="56" r="1.5" fill="#FF9900" />

  <circle cx="47" cy="30" r="1.5" fill="#FF9900" />
  <circle cx="53" cy="30" r="1.5" fill="#FFC72C" />
  <circle cx="47" cy="36" r="1.5" fill="#FFC72C" />
  <circle cx="53" cy="36" r="1.5" fill="#FF9900" />
  <circle cx="47" cy="42" r="1.5" fill="#FFC72C" />
  <circle cx="53" cy="42" r="1.5" fill="#FFC72C" />
  <circle cx="47" cy="48" r="1.5" fill="#FF9900" />
  <circle cx="53" cy="48" r="1.5" fill="#FFC72C" />

  <circle cx="69" cy="38" r="1.5" fill="#FFC72C" />
  <circle cx="75" cy="38" r="1.5" fill="#FF9900" />
  <circle cx="69" cy="44" r="1.5" fill="#FF9900" />
  <circle cx="75" cy="44" r="1.5" fill="#FFC72C" />
  <circle cx="69" cy="50" r="1.5" fill="#FFC72C" />
  <circle cx="75" cy="50" r="1.5" fill="#FF9900" />

  <!-- Cloud Nodes floating above -->
  <path d="M35 24 C35 18, 42 16, 47 20 C50 16, 58 17, 60 21 C64 21, 67 24, 65 28 C64 30, 36 30, 35 24 Z" fill="rgba(255,255,255,0.15)" stroke="url(#cloudCityGrad)" stroke-width="1.5" />
  
  <!-- AWS Smile Curved Circuit Line -->
  <path d="M22 80 C40 92, 60 92, 78 80" stroke="url(#cloudCityGrad)" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="76,77 82,80 77,84" fill="#FF9900" />
